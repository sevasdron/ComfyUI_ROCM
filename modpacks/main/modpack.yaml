# Модпак main — основная рабочая сборка (ADR-0002, ADR-0006).
# Читают tools/comfy (через tools/modpack.py) при build / run / update / promote.

name: main

# Тег ядра comfy-core, на котором собран текущий stable. Меняет `tools/comfy promote`;
# `tools/comfy build main --core REF` и `update --to REF` собирают candidate на другом.
core: v0.35.1

# Порт stable на хосте. Candidate поднимается на port+1 (8101).
port: 8100

# ComfyUI-Manager. Включён, пока состав нод подбирается (вариант B: ноды по потребности);
# всё, что поставлено через Manager, `tools/comfy sync` покажет как лишнее, пока не попадёт
# в nodes.lock через `tools/comfy node add`.
manager: true

# Монтирование моделей: ro — только чтение (умолчание, ADR-0003); rw — запись, нужна Lora Manager
# (превью и .metadata.json он кладёт рядом с файлами моделей). Включено 17.09 по решению пользователя.
models: rw

# Ключи запуска ComfyUI (те же, что были в ~/bin/start_comfy_manager — не терять).
args:
  - --disable-mmap
  - --gpu-only
  - --bf16-vae

# pip-зависимости нод при сборке образа.
pip:
  exclude:            # пакеты из requirements.txt нод, которые в образ не ставим
    - pedalboard      # P2: колесо 0.9.25 даёт SIGILL на этом CPU, роняет весь ComfyUI
    - sam2            # comfyui-impact-pack: git+https сборка SAM2 (CUDA-расширение); для ImpactStringSelector не нужна
    - ultralytics     # ComfyUI-Mickmumpitz-Nodes: только YOLO-детектор (импорт ленивый, с понятной ошибкой); нам нужны AudioExists/ImageExists
    - opencv-python   # поверх opencv-python-headless из ядра: два cv2 в одном venv
    - opencv-contrib-python  # то же; ComfyUI_LayerStyle берёт guidedFilter в try/except и живёт без contrib
  extra:              # пакеты, которых нет в requirements нод, но они нужны (например, llama-cpp)
    - soundfile       # ComfyUI-FL-YuE2 импортирует его при загрузке (обучающие ноды), в requirements пакета нет; ядро живёт на torchaudio/av

# Системные пакеты Fedora для нод (ставятся dnf при сборке образа модпака).
dnf: []
