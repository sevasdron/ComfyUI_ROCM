# Политика нод: что на этом железе (gfx1151 / ROCm) не работает, чем заменяем, где нужны свои ноды.
# Применяется автоматически: bash tools/comfy workflow deps ФАЙЛ.json — для каждой ноды воркфлоу,
# найденной здесь, печатается пометка. Замеры, на которых основаны решения: docs/rocm-accelerators.md.
#
# status:
#   replace — на нашем железе не работает (или работает вхолостую), есть прямая замена: with
#   bypass  — заменить нечем, ноду обойти (Bypass); воркфлоу от этого не ломается
#   ours    — есть наша нода из пака ROCm Halo, ставить её вместо upstream-ноды
#   caution — работает, но с оговоркой (нужна соседняя нода, ключ запуска и т.п.)
#   ok      — работает как есть (записываем, чтобы не проверять повторно)
#
# verified: чем подтверждено — run (настоящий прогон воркфлоу) | bench (синтетика tools/comfy attn-bench) |
#   docs (только документация/код пакета) | no. Пока не run — замена остаётся кандидатом, проверяем на прогоне.

# Ноды, которые живут только во фронтенде (JS) и в /object_info не попадают: их «отсутствие» в схеме — не повод
# ставить пакет. tools/workflow-deps.py вычитает их из списка недостающих.
frontend_only:
  - Fast Bypasser (rgthree)
  - Fast Groups Bypasser (rgthree)
  - Fast Groups Muter (rgthree)
  - Fast Muter (rgthree)
  - Node Collector (rgthree)
  - Label (rgthree)

nodes:

  # --- аттеншен ---------------------------------------------------------------------------------
  MiniMaxH3MemoryEfficientSageAttentionPatch:
    status: replace
    with: 'Model Attention Backend (ядро), backend = "comfy kitchen attention"'
    why: >
      Прогон 16.09 подтвердил: нода падает с RuntimeError "sageattention is not new enough version or could not
      determine CUDA architecture" — пакета sageattention под ROCm нет (P6). Замена подтверждена тем же днём на
      воркфлоу MiniMax H3 2-Stages: шаг сэмплинга 79.5 с против 417 с у pytorch SDPA (5.25x), ценой +17 ГиБ ОЗУ.
      Ставим Model Attention Backend = comfy kitchen attention, Sage-ноду удаляем.
    verified: run          # что нода не работает — подтверждено прогоном
    replacement_verified: run
  LTX2MemoryEfficientSageAttentionPatch:
    status: replace
    with: 'Model Attention Backend, backend = "comfy kitchen attention"'
    why: то же, что у MiniMax-версии.
    verified: no
  WanVideoMemoryEfficientSageAttentionPatch:
    status: replace
    with: 'Model Attention Backend, backend = "comfy kitchen attention"'
    why: то же, что у MiniMax-версии.
    verified: no
  PathchSageAttentionKJ:
    status: replace
    with: 'Model Attention Backend, backend = "comfy kitchen attention"'
    why: то же; нода KJNodes требует пакет sageattention, которого под ROCm нет.
    verified: docs
  SolAttnPatch:
    status: replace
    with: 'Block Sparse Attention (ядро), method = sol-attn'
    why: >
      Репозиторий ComfyUI-SolAttn_triton помечен автором DEPRECATED (реализация уехала в ядро), ядра писались
      под RTX 4090/5090. В ядре тот же sol-attn идёт через HIP-бэкенд comfy-kitchen и на gfx1151 даёт
      2.0x на 8k токенов и 4.1x на 32k против SDPA (синтетика; качество на реальных активациях не проверено).
    verified: bench
  SolAttnBlockProbe:
    status: bypass
    why: диагностика к SolAttnPatch; с нодой ядра не нужна.
    verified: docs
  BlockSparseAttention:
    status: ok
    why: sol-attn через HIP запускается; выигрыш на синтетике растёт с длиной (docs/rocm-accelerators.md).
    verified: bench
  ModelAttentionBackend:
    status: ok
    why: '"comfy kitchen attention" доступен — int8_attention_is_available() = True на gfx1151.'
    verified: bench

  # --- наши ноды (пак ROCm Halo) ----------------------------------------------------------------
  Trellis2UpsampleStage:
    status: ours
    with: RH Trellis2 Upsample Stage
    why: >
      upstream жёстко считает исходный латент формы 512 (P14); при structure resolution=64 меш выходит за
      куб ±0.5 и RemeshMesh молча отдаёт пустоту.
    verified: run
  BakeTextureFromVoxel:
    status: caution
    with: RH Cast to float32 перед нодой
    why: с --bf16-vae цвета вокселей приходят в bf16, а дальше по цепочке .numpy() (P12/P13).
    verified: run
  PaintMesh:
    status: caution
    with: RH Cast to float32 перед нодой
    why: то же, что у BakeTextureFromVoxel.
    verified: run
  VaeDecodeTextureTrellis:
    status: caution
    with: RH Cast to float32 после ноды
    why: текстурный VAE отдаёт bf16 при --bf16-vae (P13).
    verified: run

  Sigmas Split:
    status: replace
    with: SplitSigmas (ядро)
    why: >
      нода из RES4LYF; ради одного деления расписания сигм тащить большой пакет сэмплеров не нужно —
      в ядре есть SplitSigmas (и SplitSigmasDenoise). Проверить соответствие параметров при подстановке.
    verified: docs

  # --- NVIDIA-only ------------------------------------------------------------------------------
  NVIDIA_RTXVideoEnhance:
    status: bypass
    why: пакет comfyui_nvidia_rtx_nodes работает только на RTX (NVIDIA Maxine); замены нет.
    verified: docs
