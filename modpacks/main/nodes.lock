#   ref:  полный SHA коммита (tools/comfy node bump обновляет)
#   patches: файлы из modpacks/main/patches/, накладываются после checkout (tools/comfy sync --apply)
# Правится командами tools/comfy node add | bump; sync сверяет папку с этим файлом.
